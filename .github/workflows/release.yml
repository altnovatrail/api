# NovaTrail's shared release, pinned to a release of .github by SHA with its version
# beside it. RELEASE_LINE is the line the releases are numbered in; paths, what they are built from.
# A release of api is its binaries and the Dockerfile a deployment builds the image by, each
# signed. Nobody tags by hand: the shared workflow tags the commit it
# releases.
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_LINE: "0.1"

jobs:
  release:
    name: Release
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: altnovatrail/.github/.github/workflows/release.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34
    # The go kind's list, and what api's release takes beyond it: the Dockerfile it carries, the
    # file git archive writes the commit into, with the attributes that make it do so, and
    # modules.json, which the binary embeds, so that a pull request that pins another release of
    # modules makes a release. The programs the tests build, under testdata/, are no part of
    # it.
    with:
      paths: |
        *.go
        :(exclude)*_test.go
        :(exclude)*/testdata/*
        go.mod
        go.sum
        justfile
        LICENSE
        Dockerfile
        modules.json
        .gitattributes
        internal/version/archive.txt
        .devcontainer/Dockerfile
        .github/workflows/release.yml
