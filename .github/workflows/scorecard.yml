# OpenSSF Scorecard, pinned to a release of .github. Like the shared file, it has no
# env or defaults and only read permission at the top, as the Scorecard server asks of a workflow
# that publishes.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: altnovatrail/.github/.github/workflows/scorecard.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34
