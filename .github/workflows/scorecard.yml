# OpenSSF Scorecard, pinned to a release of .github. Like the shared file, it has no
# env or defaults and only read permission at the top, as the Scorecard server asks of a workflow
# that publishes.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: altnovatrail/.github/.github/workflows/scorecard.yml@f1c7e9e6f8245fdbdbc23c4091f3c26350e3a44e # v0.1.33
