# NovaTrail's shared checks, pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  # The repository's Go code, by its own ci- recipes in its toolchain stage, and the coverage of
  # its tests, which the shared workflow sends to Codecov. id-token: write is
  # for its coverage job alone, which asks for an OIDC token: a called workflow can only lower
  # what this job gives it.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34

  # api's image, as a deployment builds it from a release and as it builds from the source, on the
  # runner, which has Docker where the devcontainer has none. The script is the whole check.
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image of the stage toolchain-core from the cache, by the key and the path "Go /
      # toolchain" and "Documents" save it under on main, so the entry is theirs; read only, as no
      # job here saves it. release-files needs Node, just and Go alone, so image.sh takes the
      # core, without the apt of nss_wrapper, as the release does.
      - name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain-core.tar
          key: toolchain-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Build and check the images
        env:
          TOOLCHAIN_TAR: ${{ runner.temp }}/novatrail-toolchain-core.tar
        run: .github/image.sh

  # The check of modules.json: the signature of the pinned release's index by
  # release-verify, its digest, and the rules against main's — on every pull request and push, with
  # no filter of paths, since a new tag of spec may raise what release-verify accepts. It reads
  # main's modules.json from the history, and spec/justfile from the submodule. Then it lays the
  # release's packages and runs the test of the first app's path on them: the test's build,
  # with no cache in the toolchain stage, is why the job has 25 minutes.
  modules:
    name: Modules
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      # As in the job Image, but of the stage toolchain: the test of the first app's path starts
      # PostgreSQL, which needs the nss_wrapper of that stage under the runner's uid, and
      # "Go / toolchain" saves that entry on main for "Go / test".
      - name: Toolchain image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/novatrail-toolchain.tar
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Check modules.json
        env:
          TOOLCHAIN_TAR: ${{ runner.temp }}/novatrail-toolchain.tar
        run: .github/modules.sh ci-modules
