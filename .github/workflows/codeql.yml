# CodeQL over the repository's workflows and its languages, pinned to a release of
# .github. The job gives the shared workflow what it needs to upload its results.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: altnovatrail/.github/.github/workflows/codeql.yml@baa18cde370b3515e85b180d0563cb3eaa4955f2 # v0.1.34
    # Go is read from a build, with the Go the toolchain stage of .devcontainer/Dockerfile pins, from
    # its archive checked by its sum, with no image.
    with:
      languages: go
