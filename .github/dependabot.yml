version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The images of the Dockerfile of a release (R28 in docs/decisions.md): Dependabot raises their
  # digests. The Go of the builder is the one go.mod and the devcontainer name, and moves with them
  # by hand, so its version is not raised here, only the digest of the tag it names.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  # The Go modules the code is built from. The tools the recipes run by go run at an exact
  # version, and Go itself, an ARG of .devcontainer/Dockerfile, Dependabot does not see: they are
  # raised by hand.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # spec's Go modules move together with the spec submodule, to its tag, in a task of its own,
    # and ci-lint holds them to it (R64 in spec; R27 in docs/decisions.md): a tag of spec comes out
    # with every change to its documents, so Dependabot does not raise them. A library whose
    # release requires spec at its own tag joins them here when it joins go.mod: a newer one may
    # require a newer spec.
    ignore:
      - dependency-name: github.com/altnovatrail/spec
      - dependency-name: github.com/altnovatrail/spec/contracts
