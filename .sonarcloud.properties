# SonarCloud's automatic analysis of the repository (R30 in spec; R27 in docs/decisions.md). The
# Go tests, *_test.go, and the programs the tests build, under testdata/, are read as tests and not
# as code; spec/ is the submodule, which spec's own analysis reads. The paths in sonar.sources and
# sonar.tests are plain paths; the patterns are in the inclusions and exclusions.
sonar.sources=.
sonar.tests=.
sonar.exclusions=spec/**,**/*_test.go,**/testdata/**
sonar.test.inclusions=**/*_test.go,**/testdata/**
sonar.test.exclusions=spec/**
